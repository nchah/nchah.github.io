<!DOCTYPE html>
 <!-- Adapted from http://bl.ocks.org/mbostock/1153292 -->
<head>
  <meta charset="utf-8">
  <title>GraphIt Explorer</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <link href="https://fonts.googleapis.com/css?family=Roboto+Mono" rel="stylesheet"> 
  <script defer src="https://code.getmdl.io/1.3.0/material.min.js"></script>
  <script src="https://d3js.org/d3.v3.min.js"></script>
  <script type="text/javascript" src="js/graph.js"></script>

  
<div style="text-align:center;">
  <br>
  <span style="font-size: 18px;">GraphIt Explorer</span>
  <br>
  <div>
  <span style="color:grey; font-style:italic; font-size:14px;">A force-directed graph of arbitrary triples.</span>
  </div>
  <br>

  <details>
  <summary>Expand User Guide</summary>
  <br>
  <!-- User guide in detail -->
  <span style="color:black; font-weight:bold; text-decoration:underline; font-size:16px;">User Guide</span>
  <br>
  <br>
  <div style="color:black; font-size:14px; width:50%; margin-left:25%; margin-right:25%;">
  <span style="" class="question">...</span><br>
    <div class="answer">
    ...
    </div>
  <br>
  <span style="" class="question">...</span><br>
    <div class="answer">
    ...
    </div>
  <br>
  <br>
  </details>

  <br>
  <svg id="visualization" style="text-align: center;" width="1200" height="500">
     <rect width="1200" height="500" stroke="black" fill="none" style="stroke-width: 2; border: 2px solid black"></rect>
  </svg>
  <br>  
  <br>
  <div style="text-align:center;">
    <form>
      <span style="font-size: 14px;">Label Size</span>
      <input type="text" id="labelSize" name="labelSize" value="12" style="width: 50px; padding: 2px; border: 1px solid black">
      <span style="font-size: 14px;">Node Size</span>
      <input type="text" id="nodeSize" name="nodeSize" value="12" style="width: 50px; padding: 2px; border: 1px solid black">
      <span style="font-size: 14px;">Show Arrows</span>
      <input type="checkbox" id="arrows" name="arrows">
      <span style="font-size: 14px;">Show Labels</span>
      <input type="checkbox" id="labels" name="labels">
      <!-- <button class="button" id="graphIt" onclick="draw2()">Apply Settings</button> -->
    </form>
  </div>
  <br>
  <span style="color:grey; font-size:14px;">
    Enter arbitrary triples below. One triple per line (semicolon ';' separated for each element).
  </span>
  <textarea id="textBox" cols="100" rows="5"></textarea>
  <br><br>
  <button class="button" id="graphIt" onclick="draw2()">Graph It !</button>
  <br>
  <br>
<script type="text/javascript" src="js/graph.js"></script>
</div>
</body>
</html>
